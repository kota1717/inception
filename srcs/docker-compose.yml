services:
  nginx:
    pull_policy: build
    build: requirements/nginx/.
    container_name: inception_nginx
    ports:
      - "443:443"
    volumes:
      - ./website-files:/var/www/html
    networks:
      - inception-network
    depends_on:
      - wordpress
  wordpress:
    pull_policy: build
    build: requirements/wordpress/.
    container_name: wordpress
    env_file:
      - .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - /home/ikota/data/wordpress:/var/www/html
    networks:
      - inception-network
    depends_on:
      - mariadb
  mariadb:
    pull_policy: build
    build: ./requirements/mariadb
    container_name: mariadb
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - /home/ikota/data/mariadb:/var/lib/mysql
    networks:
      - inception-network
    restart: on-failure

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt

volumes:
  mariadb-data:
    driver: local
networks:
  inception-network:
    driver: bridge
