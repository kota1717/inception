services:
  nginx:
    pull_policy: build
    image: nginx
    build: requirements/nginx/.
    container_name: inception_nginx
    ports:
      - "443:443"
    networks:
      - inception-network
    depends_on:
      - wordpress
  wordpress:
    pull_policy: build
    image: wordpress
    build: requirements/wordpress/.
    container_name: inception_wordpress
    env_file:
      - .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception-network
    depends_on:
      - mariadb
  mariadb:
    pull_policy: build
    image: mariadb
    build: ./requirements/mariadb
    container_name: inception_mariadb
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception-network
    restart: on-failure

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt

volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ikota/data/wordpress

  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ikota/data/mariadb

networks:
  inception-network:
    driver: bridge
