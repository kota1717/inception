services:
  nginx:
    build: requirements/nginx/.
    container_name: inception_nginx
    ports:
      - "8443:443"
    volumes:
      - ./website-files:/var/www/html
    depends_on:
      - wordpress
  wordpress:
    build: requirements/wordpress/.
    container_name: wordpress
    volumes:
      - ./website-files:/var/www/html
